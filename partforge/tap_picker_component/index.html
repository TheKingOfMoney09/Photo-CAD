<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0e1117; }
  #wrap { position:relative; display:inline-block; cursor:crosshair;
    z-index:1; }
  #wrap img { display:block; max-width:100%; user-select:none;
    -webkit-user-select:none; -webkit-user-drag:none; }
  .tap { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px;
         border-radius:50%; border:2px solid #fff; pointer-events:none; }
  .tap.fg { background:rgba(245,158,11,.9); }
  .tap.bg { background:rgba(239,68,68,.9); }
  #hint { color:#9fb0c3; font:12px system-ui, sans-serif; padding:6px 2px; }
  #bar { padding:6px 2px; display:flex; gap:8px; }
  #bar button { background:#2d333b; color:#e6e9ee; border:1px solid #444c56;
    border-radius:6px; padding:4px 12px; font-size:12.5px; cursor:pointer; }
  #bar button.on { background:#f59e0b; color:#111; font-weight:700; border-color:#f59e0b; }
</style>
</head>
<body>
<div id="bar">
  <button id="bFg" class="on">◉ tap = part</button>
  <button id="bBg">◉ tap = not part</button>
  <button id="bClear">clear</button>
</div>
<div id="wrap"><img id="img" alt="rectified photo"></div>
<div id="hint">click the metal face (2–4 taps). Right areas erase. Then press Re-measure below.</div>
<script>
let mode = "fg", taps = [], eraser = [];
function sendValue() {
  window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:setComponentValue",
    value: {taps: taps, eraser: eraser}}, "*");
}
function ready() {
  window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1}, "*");
  window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 640}, "*");
}
function draw() {
  document.querySelectorAll('.tap').forEach(e => e.remove());
  const wrap = document.getElementById('wrap');
  const img = document.getElementById('img');
  const r = img.getBoundingClientRect();
  const sx = r.width / img.naturalWidth, sy = r.height / img.naturalHeight;
  for (const [x, y] of taps) {
    const d = document.createElement('div'); d.className = 'tap fg';
    d.style.left = (x * sx) + 'px'; d.style.top = (y * sy) + 'px'; wrap.appendChild(d);
  }
  for (const [x, y] of eraser) {
    const d = document.createElement('div'); d.className = 'tap bg';
    d.style.left = (x * sx) + 'px'; d.style.top = (y * sy) + 'px'; wrap.appendChild(d);
  }
}
document.getElementById('bFg').onclick = (e) => { mode = "fg"; e.target.classList.add('on'); document.getElementById('bBg').classList.remove('on'); };
document.getElementById('bBg').onclick = (e) => { mode = "bg"; e.target.classList.add('on'); document.getElementById('bFg').classList.remove('on'); };
document.getElementById('bClear').onclick = () => { taps = []; eraser = []; draw(); sendValue(); };
document.getElementById('img').addEventListener('click', (e) => {
  e.preventDefault(); e.stopPropagation();
  const img = document.getElementById('img');
  const r = img.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * img.naturalWidth);
  const y = Math.round((e.clientY - r.top) / r.height * img.naturalHeight);
  (mode === "fg" ? taps : eraser).push([x, y]);
  draw(); sendValue();
});
document.getElementById('wrap').addEventListener('click', (e) => {
  if (e.target.id === 'img') return;  // img handler already ran
  const img = document.getElementById('img');
  const r = img.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * img.naturalWidth);
  const y = Math.round((e.clientY - r.top) / r.height * img.naturalHeight);
  (mode === "fg" ? taps : eraser).push([x, y]);
  draw(); sendValue();
});
window.addEventListener('message', (e) => {
  if (e.data.type === 'streamlit:render') {
    const a = e.data.args;
    document.getElementById('img').src = 'data:image/png;base64,' + a.png_b64;
    taps = a.taps || []; eraser = a.eraser || [];
    document.getElementById('img').onload = draw;
    draw();
  }
});
ready();
</script>
</body>
</html>
